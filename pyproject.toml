[project]
name = "rutern"
version = "0.1.0"
description = "CLI and MCP server for the Telenor WiFi Ruter II (Zyxel EX5700)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wealthystudent" }]
requires-python = ">=3.12"
keywords = ["telenor", "zyxel", "ex5700", "router", "mcp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]
dependencies = [
    "certifi>=2024",
    "httpx>=0.27,<1",
    "pydantic>=2.12,<3",
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/wealthystudent/rutern"
Issues = "https://github.com/wealthystudent/rutern/issues"

[project.scripts]
rutern = "rutern.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rutern"]

[tool.hatch.build.targets.sdist]
include = ["src/rutern", "tests", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to the real router; run explicitly with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
