[project]
name = "rutern"
version = "0.1.0"
description = "Read and configure a Telenor Zyxel EX5700 router from a CLI and an MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "mcp>=2.3,<3",
]

[project.scripts]
rutern = "rutern.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rutern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to the real router; run explicitly with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
